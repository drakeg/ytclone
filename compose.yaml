services:
  web:
    build:
      context: .
    env_file:
      - .env
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000
      DJANGO_DB_PATH: /app/data/db.sqlite3
      DJANGO_DEBUG: "true"
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_SESSION_COOKIE_SECURE: "false"
      DJANGO_CSRF_COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - sqlite_data:/app/data
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/videos/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  test:
    profiles: ["test"]
    build:
      context: .
    env_file:
      - .env
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_DB_PATH: /tmp/ytclone-test.sqlite3
      DJANGO_DEBUG: "true"
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_SESSION_COOKIE_SECURE: "false"
      DJANGO_CSRF_COOKIE_SECURE: "false"
    entrypoint: ["sh", "/app/docker/test.sh"]
    volumes:
      - .:/app

volumes:
  sqlite_data:
  media_data:
