{% extends 'base.html' %}
{% block title %}Register · VideoShare{% endblock %}
{% block content %}
<header class="page-header"><div><p class="eyebrow">Join VideoShare</p><h1>Create an account</h1><p>Register to create, comment, subscribe, and build playlists.</p></div></header>
<div class="form-panel">
<form method="post" action="{% url 'register' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Create Account</button>
</form>
<p class="mt-3 mb-0">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
