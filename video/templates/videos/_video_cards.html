<div class="row g-3">
    {% for video in videos %}
        <div class="col-12 col-sm-6 col-lg-3 video">
            <div class="thumbnail">
                <a href="{% url 'video_detail' video.pk %}">
                    <img class="img-fluid" src="{{ video.thumbnail.url }}" alt="Thumbnail for {{ video.title }}">
                </a>
            </div>
            <div class="video_title"><a href="{% url 'video_detail' video.pk %}">{{ video.title }}</a></div>
            <div class="video_author">{{ video.author }}</div>
            <div class="video_views">{{ video.views }} views</div>
            <div class="video_upload">{{ video.pub_date|timesince }} ago</div>
        </div>
    {% empty %}
        <p class="text-body-secondary">No videos to show yet.</p>
    {% endfor %}
</div>
