{% if request.user.is_authenticated %}
<form method="post" action="{% if saved_for_later %}{% url 'watch_later_remove' video.pk %}{% else %}{% url 'watch_later_add' video.pk %}{% endif %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button class="btn btn-outline-secondary" type="submit">{% if saved_for_later %}Remove from Watch Later{% else %}Watch Later{% endif %}</button>
</form>
{% endif %}
