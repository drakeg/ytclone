{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <h1>Delete your comment?</h1>
    <blockquote class="border-start ps-3">{{ comment.comment }}</blockquote>
    <p>This permanently removes your comment. This action cannot be undone.</p>
    {% if comment.replies.exists %}<p>Replies in this thread will also be deleted.</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Delete comment</button>
        <a class="btn btn-outline-secondary" href="{% url 'video_detail' comment.video.pk %}">Cancel</a>
    </form>
</div>
{% endblock %}
