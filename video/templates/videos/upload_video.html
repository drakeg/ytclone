{% extends 'base.html' %}
{% block title %}Upload · VideoShare{% endblock %}
{% block content %}
<header class="page-header"><div><p class="eyebrow">Creator studio</p><h1>Upload video</h1><p>Choose the channel, media, and visibility for your next release.</p></div></header>
<form class="form-panel" method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<div class="form-actions"><button type="submit" class="btn btn-primary">Upload</button></div></form>
{% endblock %}
