{% extends 'base.html' %}

{% block content %}
    <h1>Edit {{ video.title }}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save changes</button>
        <a class="btn btn-outline-secondary" href="{% url 'video_detail' video.pk %}">Cancel</a>
    </form>
{% endblock %}
